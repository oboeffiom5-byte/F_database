<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        :root {
            --ink: #0b1220;
            --blue: #2f5bff;
            --blue-dark: #2447d6;
            --line: #dfe4ee;
            --muted: #667085;
            --bg: #f5f7fb;
            --mint: #12b76a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }
        .nav { background: #ffffff; border-bottom: 1px solid var(--line); }
        .nav-inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #5b7bff, #2f5bff); }
        .nav-right { display: flex; align-items: center; gap: 14px; }
        .avatar {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: #e5ebff;
            color: var(--blue);
            font-weight: 700;
        }
        .logout {
            padding: 10px 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .logout:hover { border-color: #b9c2d3; }

        .content { max-width: 1040px; margin: 0 auto; padding: 40px 24px 64px; }
        .welcome {
            position: relative;
            overflow: hidden;
            padding: 44px 40px;
            margin-bottom: 24px;
            border-radius: 24px;
            color: #ffffff;
            background: linear-gradient(155deg, #0b1220 0%, #16254d 100%);
        }
        .welcome::before {
            content: "";
            position: absolute;
            width: 420px; height: 420px;
            right: -120px; top: -160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(47, 91, 255, 0.55), rgba(47, 91, 255, 0) 70%);
        }
        .welcome h1 { position: relative; margin: 0 0 10px; font-size: 36px; letter-spacing: -0.03em; }
        .welcome p { position: relative; margin: 0; color: #b4bfdc; font-size: 16px; }

        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: #ffffff; }
        .card small { color: var(--muted); font-size: 13px; }
        .card b { display: block; margin-top: 8px; font-size: 20px; letter-spacing: -0.01em; }
        .status { display: inline-flex; align-items: center; gap: 8px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); }

        @media (max-width: 800px) {
            .cards { grid-template-columns: 1fr; }
            .welcome { padding: 32px 24px; }
            .welcome h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="nav-inner">
            <div class="logo"><span class="logo-mark"></span>UserHub</div>
            <div class="nav-right">
                <div class="avatar">{{ username[0]|upper }}</div>
                <a class="logout" href="/logout">Log out</a>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="welcome">
            <h1>Welcome, {{ username }}</h1>
            <p>You are signed in. This is your personal dashboard.</p>
        </div>

        <div class="cards">
            <div class="card">
                <small>Signed in as</small>
                <b>{{ username }}</b>
            </div>
            <div class="card">
                <small>Account status</small>
                <b class="status"><span class="dot"></span>Active</b>
            </div>
            <div class="card">
                <small>Account type</small>
                <b>User</b>
            </div>
        </div>
    </div>
</body>
</html>
